name: pages

on:
  workflow_run:
    workflows:
      - "tests"
    types:
      - completed
    branches:
      - "main"

jobs:
  pages:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download code coverage report
        uses: actions/download-artifact@v6
        with:
          name: code-coverage-report-3.14
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download code coverage badge
        uses: actions/download-artifact@v6
        with:
          name: coverage-badge-3.14
          path: badge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare Pages site
        shell: bash
        run: >
          mv badge/badge.svg pages/badge.svg
          cp -r coverage/html pages/htmlcov
          cp coverage/coverage.md pages/
          cp coverage/coverage.xml pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
